name: mswea-eval-q30a3b-chroot-slice30-v4
type: common
image: "346"
dc: "19"
cpus: 64
ram: 512
gpus: 4
replicas: 1
privileged: true
hostnetwork: false
node_exclusive: false
maxrunseconds: 14400
cmd: >-
  RT=/path/to/SWE-MiniSandbox/.runtime/mswea-eval-q30a3b-chroot-slice30-v4 &&
  mkdir -p "$RT" &&
  { echo "ASCEND_VISIBLE_DEVICES=[$ASCEND_VISIBLE_DEVICES]"; npu-smi info 2>&1 | head -30; } > "$RT/devdiag.txt" 2>&1 &&
  cd /path/to/SWE-MiniSandbox &&
  export MODEL_PATH=/path/to/workspace/models/Qwen3-30B-A3B-Instruct-2507
  SERVED_MODEL_NAME=Qwen3-30B-A3B
  MODEL_NAME=openai/Qwen3-30B-A3B
  VLLM_ENV_NAME=vllm-ascend-cann8.5-v017
  TENSOR_PARALLEL_SIZE=4 DATA_PARALLEL_SIZE=2
  MAX_MODEL_LEN=32768 MAX_NUM_SEQS=256 GPU_MEMORY_UTILIZATION=0.9
  ENFORCE_EAGER=1 ENABLE_EXPERT_PARALLEL=0 ASYNC_SCHEDULING=0 ASCEND_PERF_TUNING=0
  NUM_WORKERS=16 INSTANCE_SLICE=:30 STEP_LIMIT=40 SERVER_START_TIMEOUT=1800
  RUNTIME_ROOT="$RT" &&
  bash /path/to/SWE-MiniSandbox/sh/run_minisweagent_gen.sh
