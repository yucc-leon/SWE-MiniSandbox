name: fast-cache-build
type: common
image: "346"
dc: "19"
cpus: 64
ram: 512
gpus: 0
replicas: 1
privileged: false
hostnetwork: false
node_exclusive: false
maxrunseconds: 21600
cmd: >-
  cd /path/to/SWE-MiniSandbox &&
  source /path/to/workspace/miniforge3/etc/profile.d/conda.sh && conda activate swe-sandbox &&
  unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY all_proxy ALL_PROXY &&
  git config --global http.proxy "" && git config --global https.proxy "" &&
  rm -rf /tmp/cct && (timeout 60 git clone --depth 1 https://github.com/swesmith/jd__tenacity.0d40e76f /tmp/cct >/dev/null 2>&1 && echo "POD_CLONE=OK" || echo "POD_CLONE=FAIL") && rm -rf /tmp/cct &&
  ROOT=/path/to/SWE-MiniSandbox &&
  export PYTHONPATH=$ROOT/SWE-ReX/src:$ROOT/SWE-agent:$ROOT/sandboxdev:$ROOT/SWE-bench:$ROOT/R2E-Gym/src LITELLM_LOCAL_MODEL_COST_MAP=True &&
  CACHE=$ROOT/vendor/swesmith-cache/diverse-login-cache && rm -rf $CACHE && mkdir -p $CACHE/sandbox &&
  python -m sweagent run-batch --config $ROOT/config/swesmith_infer.yaml --env_type sandbox --num_workers 12
  --agent.type empty --agent.pre_check false
  --instances.type swesmith --instances.path $ROOT/dataset/SWE-smith --instances.split train --instances.start 0 --instances.end 59136
  --instances.filter "$(cat $ROOT/vendor/chroot_diverse_filter.txt)" --instances.slice ':80'
  --instances.deployment.data_type swesmith --instances.deployment.use_chroot false
  --instances.deployment.root_base $CACHE/sandbox --instances.deployment.git_base_path $CACHE/gitcache --instances.deployment.shared_venv $CACHE/shared_venv
  --instances.deployment.conda_env /path/to/workspace/minisandbox-conda --instances.deployment.wheelhouse $ROOT/vendor/minisandbox-wheelhouse --instances.deployment.tool_path $ROOT/SWE-agent/tools
  --output_dir $CACHE/build-output
