name: verify-grader
type: common
image: "346"
dc: "19"
cpus: 32
ram: 256
gpus: 0
replicas: 1
privileged: true
hostnetwork: false
node_exclusive: false
maxrunseconds: 7200
cmd: >-
  cd /path/to/SWE-MiniSandbox &&
  source /path/to/workspace/miniforge3/etc/profile.d/conda.sh && conda activate swe-sandbox &&
  ROOT=/path/to/SWE-MiniSandbox &&
  PURL=$(cat $ROOT/vendor/.proxy_url) &&
  export http_proxy=$PURL https_proxy=$PURL HTTP_PROXY=$PURL HTTPS_PROXY=$PURL &&
  git config --global http.proxy "$PURL" && git config --global https.proxy "$PURL" && git config --global http.proxyAuthMethod basic &&
  export PYTHONPATH=$ROOT/SWE-ReX/src:$ROOT/SWE-agent:$ROOT/sandboxdev:$ROOT/SWE-bench:$ROOT/R2E-Gym/src
  LITELLM_LOCAL_MODEL_COST_MAP=True SWESMITH_FULL_DEPS=1 SWE_RELINK_EDITABLE=1 &&
  HSH=$(python3 -c "print('|'.join(l.strip().rsplit('__',1)[1] for l in open('$ROOT/vendor/diag5_ids.txt') if l.strip()))") &&
  SRC=$ROOT/vendor/swesmith-cache/diag-modelpath-fixed &&
  P=$ROOT/vendor/swesmith-cache/verify-grader && rm -rf $P && mkdir -p $P/gitcache $P/shared_venv &&
  cp -r $SRC/gitcache/* $P/gitcache/ 2>/dev/null; cp -r $SRC/shared_venv/* $P/shared_venv/ 2>/dev/null;
  run(){ python -m sweagent run-batch --config $ROOT/config/swesmith_infer.yaml --env_type sandbox --num_workers 5
  --agent.type empty --agent.pre_check true
  --instances.type swesmith --instances.path $ROOT/dataset/SWE-smith --instances.split train --instances.start 0 --instances.end 59136
  --instances.filter ".*__($HSH)" --instances.slice :6
  --instances.deployment.data_type swesmith --instances.deployment.use_chroot false
  --instances.deployment.root_base $P/sb_$1 --instances.deployment.git_base_path $P/gitcache --instances.deployment.shared_venv $P/shared_venv
  --instances.deployment.conda_env /path/to/workspace/minisandbox-conda --instances.deployment.wheelhouse $ROOT/vendor/minisandbox-wheelhouse --instances.deployment.tool_path $ROOT/SWE-agent/tools
  --output_dir $P/out_$1; } ;
  echo "=== GOLD->1 (期望全1) ===" && run gold 2>&1 | tail -2 ;
  echo "=== BUGGY->0 (期望全0) ===" && SWE_SANDBOX_PRECHECK_NO_GOLD=1 run buggy 2>&1 | tail -2 ;
  python3 -c "import json;g=json.load(open('$P/out_gold/preds.json'));b=json.load(open('$P/out_buggy/preds.json'));print('[verify-grader] GOLD:',{k.split('__')[-1][:12]:v.get('reward') for k,v in g.items()});print('[verify-grader] BUGGY:',{k.split('__')[-1][:12]:v.get('reward') for k,v in b.items()})" | tee $P/verify.log
