name: glm50-score
type: common
image: "346"
dc: "19"
cpus: 32
ram: 256
gpus: 0
replicas: 1
privileged: true
hostnetwork: false
node_exclusive: false
maxrunseconds: 7200
cmd: >-
  cd /path/to/SWE-MiniSandbox &&
  ROOT=/path/to/SWE-MiniSandbox &&
  bash sh/swesmith_score.sh
  $ROOT/vendor/swesmith-cache/glm-sample-50/glm50/preds.json
  rl-warm-pool
  $ROOT/vendor/swesmith-cache/glm-sample-50/score
  8
  2>&1 | tee $ROOT/vendor/swesmith-cache/glm-sample-50/score.log
