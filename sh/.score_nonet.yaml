name: score-nonet
type: common
image: "346"
dc: "19"
cpus: 32
ram: 256
gpus: 0
replicas: 1
privileged: true
hostnetwork: false
node_exclusive: false
maxrunseconds: 10800
cmd: >-
  cd /path/to/SWE-MiniSandbox &&
  ROOT=/path/to/SWE-MiniSandbox &&
  bash sh/swesmith_score.sh $ROOT/vendor/swesmith-cache/nonet-exp/out/preds.json glm-904a2 $ROOT/vendor/swesmith-cache/nonet-exp/score 8
  2>&1 | tee $ROOT/vendor/swesmith-cache/nonet-exp/score.log
