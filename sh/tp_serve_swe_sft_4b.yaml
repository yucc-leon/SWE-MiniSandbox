name: serve-swe-sft-4b
type: common
image: "346"
dc: "19"
cpus: 16
ram: 128
gpus: 1
replicas: 1
privileged: false
hostnetwork: false
node_exclusive: false
maxrunseconds: 21600
cmd: >-
  RT=/path/to/SWE-MiniSandbox/.runtime/decoupled-swe-sft &&
  mkdir -p "$RT" && rm -f "$RT/api_base.txt" &&
  cd /path/to/SWE-MiniSandbox &&
  MODEL_PATH=/path/to/SWE-MiniSandbox/vendor/sft-ckpt/swe_sft_4b_hf
  SERVED_MODEL_NAME=swe-sft-4b VLLM_ENV_NAME=vllm-ascend-cann8.5-v017
  TENSOR_PARALLEL_SIZE=1 PORT=8001
  MAX_MODEL_LEN=32768 MAX_NUM_SEQS=64 GPU_MEMORY_UTILIZATION=0.9
  nohup bash /path/to/SWE-MiniSandbox/sh/serve_qwen_ascend.sh > "$RT/serve.log" 2>&1 &
  SPID=$! ;
  for i in $(seq 1 360); do
    if curl -fsS --max-time 5 http://127.0.0.1:8001/v1/models >/dev/null 2>&1; then
      echo "http://$(hostname -I | awk '{print $1}'):8001/v1" > "$RT/api_base.txt" ;
      echo "[serve] READY api_base=$(cat $RT/api_base.txt)" ;
      break ;
    fi ;
    if ! kill -0 "$SPID" 2>/dev/null; then echo "[serve] exited early"; tail -40 "$RT/serve.log"; exit 1 ; fi ;
    sleep 10 ;
  done ;
  [ -f "$RT/api_base.txt" ] || { echo "[serve] timeout"; tail -40 "$RT/serve.log"; exit 1 ; } ;
  wait "$SPID"
