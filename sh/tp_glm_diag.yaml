name: glm52-diag-fresh2
type: common
image: "346"
dc: "19"
cpus: 32
ram: 256
gpus: 0
replicas: 1
privileged: true
hostnetwork: false
node_exclusive: false
maxrunseconds: 7200
cmd: >-
  RT=/path/to/SWE-MiniSandbox/.runtime/glm52-diag-fresh2 && mkdir -p "$RT" &&
  cd /path/to/SWE-MiniSandbox &&
  export EVAL_CONFIG_PATH=/path/to/SWE-MiniSandbox/config/sweagent_infer_ascend_officiallike_chroot.yaml
  DATASET_DIR=/path/to/SWE-MiniSandbox/dataset/SWE-bench/SWE-bench_Verified/data
  INSTANCE_SLICE=:2 NUM_WORKERS=2 STEP_LIMIT=40
  AUTO_START_SERVER=0 API_BASE=http://127.0.0.1:30131/v1
  MODEL_NAME=openai/glm-5.2 SERVED_MODEL_NAME=glm-5.2
  MSWEA_API_KEY=$(cat /path/to/SWE-MiniSandbox/vendor/.glm_key)
  MSWEA_MAX_TOKENS=32768 MSWEA_TEMPERATURE=0.0
  RUNTIME_ROOT="$RT" &&
  bash /path/to/SWE-MiniSandbox/sh/run_minisweagent_gen.sh > "$RT/gen.log" 2>&1
