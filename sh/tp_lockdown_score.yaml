name: lockdown-score
type: common
image: "346"
dc: "19"
cpus: 64
ram: 512
gpus: 0
replicas: 1
privileged: true
hostnetwork: false
node_exclusive: false
maxrunseconds: 28800
cmd: >-
  cd /path/to/SWE-MiniSandbox &&
  source /path/to/workspace/miniforge3/etc/profile.d/conda.sh && conda activate swe-sandbox &&
  ROOT=/path/to/SWE-MiniSandbox &&
  PURL=$(cat $ROOT/vendor/.proxy_url) &&
  export http_proxy=$PURL https_proxy=$PURL HTTP_PROXY=$PURL HTTPS_PROXY=$PURL &&
  git config --global http.proxy "$PURL" && git config --global https.proxy "$PURL" && git config --global http.proxyAuthMethod basic &&
  export PYTHONPATH=$ROOT/SWE-ReX/src:$ROOT/SWE-agent:$ROOT/sandboxdev:$ROOT/SWE-bench:$ROOT/R2E-Gym/src
  LITELLM_LOCAL_MODEL_COST_MAP=True SWESMITH_FULL_DEPS=1 SWE_RELINK_EDITABLE=1 SWE_SANDBOX_SCORE_MODEL_PATCH=1 &&
  GEN=$ROOT/vendor/swesmith-cache/lockdown-resample/out/preds.json &&
  PATCHES=$ROOT/vendor/sft-data/lockdown_score_patches.json &&
  python3 -c "import json,glob,os; g=json.load(open('$GEN')); faith=[l.strip() for l in open('$ROOT/vendor/faithful_verified.txt') if l.strip()]; ne={k:{'model_patch':v.get('model_patch',''),'instance_id':k} for k,v in g.items() if str(v.get('model_patch','')).strip()}; can=[i for i in faith if i not in ne][:3]; [ne.update({c:{'model_patch':'','instance_id':c}}) for c in can]; json.dump(ne, open('$PATCHES','w')); open('$ROOT/vendor/sft-data/lockdown_canary_ids.txt','w').write(chr(10).join(can)); print('score set:', len(ne), 'patches (incl 3 empty canary)')" &&
  HSH=$(python3 -c "import json;print('|'.join(k.rsplit('__',1)[1] for k in json.load(open('$PATCHES'))))") &&
  N=$(python3 -c "import json;print(len(json.load(open('$PATCHES'))))") &&
  POOL=$ROOT/vendor/swesmith-cache/lockdown-score && rm -rf $POOL && mkdir -p $POOL &&
  python -m sweagent run-batch --config $ROOT/config/swesmith_infer.yaml --env_type sandbox --num_workers 12
  --agent.type empty --agent.pre_check true
  --instances.type swesmith --instances.path $ROOT/dataset/SWE-smith --instances.split train --instances.start 0 --instances.end 59136
  --instances.filter ".*__($HSH)" --instances.slice ":$N"
  --instances.model_patch_file $PATCHES
  --instances.deployment.data_type swesmith --instances.deployment.use_chroot false
  --instances.deployment.root_base $POOL/sandbox --instances.deployment.git_base_path $POOL/gitcache --instances.deployment.shared_venv $POOL/shared_venv
  --instances.deployment.conda_env /path/to/workspace/minisandbox-conda --instances.deployment.wheelhouse $ROOT/vendor/minisandbox-wheelhouse --instances.deployment.tool_path $ROOT/SWE-agent/tools
  --output_dir $POOL/score 2>&1 | tee $POOL/score.log ;
  python3 -c "import json; R='$ROOT'; d=json.load(open('$POOL/score/preds.json')); can=set(l.strip() for l in open(R+'/vendor/sft-data/lockdown_canary_ids.txt') if l.strip()); cv={k:d.get(k,{}).get('reward') for k in can}; bad=[k for k,v in cv.items() if v==1]; real=[k for k in d if k not in can]; res=[k for k in real if d[k].get('reward')==1]; print('[lockdown-score] CANARY(empty must be 0)=',cv,'GATE=', 'FAIL' if bad else 'PASS'); print('[lockdown-score] resolve =', str(len(res))+'/'+str(len(real)), '('+str(100*len(res)//max(1,len(real)))+'%) vs net-on 80%'); open(R+'/vendor/sft-data/lockdown_resolved.txt','w').write(chr(10).join(res))" 2>&1 | tee -a $POOL/score.log
