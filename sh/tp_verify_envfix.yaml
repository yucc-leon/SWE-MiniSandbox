name: verify-envfix
type: common
image: "346"
dc: "19"
cpus: 16
ram: 128
gpus: 0
replicas: 1
privileged: false
hostnetwork: false
node_exclusive: false
maxrunseconds: 10800
cmd: >-
  cd /path/to/SWE-MiniSandbox &&
  source /path/to/workspace/miniforge3/etc/profile.d/conda.sh &&
  conda activate swe-sandbox &&
  unset http_proxy https_proxy HTTP_PROXY HTTPS_PROXY all_proxy ALL_PROXY &&
  ROOT=/path/to/SWE-MiniSandbox &&
  export PYTHONPATH=$ROOT/SWE-ReX/src:$ROOT/SWE-agent:$ROOT/sandboxdev:$ROOT/SWE-bench:$ROOT/R2E-Gym/src:$ROOT/mini-swe-agent/src
  LITELLM_LOCAL_MODEL_COST_MAP=True MSWEA_COST_TRACKING=ignore_errors &&
  POOL=$ROOT/vendor/swesmith-cache/deepen-pool &&
  export EVAL_CONFIG_PATH=$ROOT/config/swesmith_infer.yaml
  MSWEA_AGENT_CONFIG=$ROOT/mini-swe-agent/src/minisweagent/config/benchmarks/swebench_minisweagent_clean.yaml
  INSTANCE_TYPE=swesmith INSTANCE_PATH=$ROOT/dataset/SWE-smith INSTANCE_SPLIT=train INSTANCE_END=59136
  INSTANCE_FILTER="$(cat $ROOT/vendor/verify_envfix_filter.txt)" INSTANCE_SLICE=':5'
  RUNTIME_ROOT=$POOL OUT_DIR=$POOL/verify-envfix
  API_BASE=http://127.0.0.1:30131/v1 MODEL_NAME=openai/glm-5.2
  MSWEA_API_KEY="$(cat $ROOT/vendor/.glm_key)" MSWEA_TEMPERATURE=1.0 MSWEA_TOP_P=0.95 MSWEA_MAX_TOKENS=32768
  NUM_WORKERS=4 STEP_LIMIT=60 MSWEA_NUM_RETRIES=6 &&
  python sh/run_minisweagent_gen.py
