name: dgbf-buggy
type: common
image: "346"
dc: "19"
cpus: 64
ram: 512
gpus: 0
replicas: 1
privileged: true
hostnetwork: false
node_exclusive: false
maxrunseconds: 21600
cmd: >-
  cd /path/to/SWE-MiniSandbox &&
  source /path/to/workspace/miniforge3/etc/profile.d/conda.sh && conda activate swe-sandbox &&
  ROOT=/path/to/SWE-MiniSandbox &&
  PURL=$(cat $ROOT/vendor/.proxy_url) &&
  export http_proxy=$PURL https_proxy=$PURL HTTP_PROXY=$PURL HTTPS_PROXY=$PURL &&
  export GIT_ASKPASS= GIT_TERMINAL_PROMPT=0 GIT_SSH_COMMAND=true &&
  export GIT_CONFIG_COUNT=3
  GIT_CONFIG_KEY_0=http.proxy GIT_CONFIG_VALUE_0=$PURL
  GIT_CONFIG_KEY_1=https.proxy GIT_CONFIG_VALUE_1=$PURL
  GIT_CONFIG_KEY_2=http.proxyAuthMethod GIT_CONFIG_VALUE_2=basic &&
  git config --global http.proxy "$PURL" && git config --global https.proxy "$PURL" && git config --global http.proxyAuthMethod basic &&
  export PYTHONPATH=$ROOT/SWE-ReX/src:$ROOT/SWE-agent:$ROOT/sandboxdev:$ROOT/SWE-bench:$ROOT/R2E-Gym/src LITELLM_LOCAL_MODEL_COST_MAP=True SWE_SANDBOX_PRECHECK_NO_GOLD=1 SWE_RELINK_EDITABLE=1 &&
  POOL=$ROOT/vendor/swesmith-cache/dgrid-b1-pool &&
  SB=$ROOT/vendor/swesmith-cache/dgbf-buggy && rm -rf $SB && mkdir -p $SB/sandbox &&
  python -m sweagent run-batch --config $ROOT/config/swesmith_infer.yaml --env_type sandbox --num_workers 12
  --agent.type empty --agent.pre_check true
  --instances.type swesmith --instances.path $ROOT/dataset/SWE-smith --instances.split train --instances.start 0 --instances.end 59136
  --instances.filter "$(cat $ROOT/vendor/dgrid-b1-pool_goldfull_filter.txt)"
  --instances.deployment.data_type swesmith --instances.deployment.use_chroot true
  --instances.deployment.root_base $SB/sandbox --instances.deployment.git_base_path $POOL/gitcache --instances.deployment.shared_venv $POOL/shared_venv
  --instances.deployment.conda_env /path/to/workspace/minisandbox-conda --instances.deployment.wheelhouse $ROOT/vendor/minisandbox-wheelhouse --instances.deployment.tool_path $ROOT/SWE-agent/tools
  --output_dir $SB/output
