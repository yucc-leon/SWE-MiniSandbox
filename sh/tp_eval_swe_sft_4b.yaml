name: eval-swe-sft-4b
type: common
image: "346"
dc: "19"
cpus: 32
ram: 256
gpus: 1
replicas: 1
privileged: true
hostnetwork: false
node_exclusive: false
maxrunseconds: 14400
cmd: >-
  cd /path/to/SWE-MiniSandbox &&
  source /path/to/workspace/miniforge3/etc/profile.d/conda.sh && conda activate swe-sandbox &&
  ROOT=/path/to/SWE-MiniSandbox &&
  PURL=$(cat $ROOT/vendor/.proxy_url) &&
  export http_proxy=$PURL https_proxy=$PURL HTTP_PROXY=$PURL HTTPS_PROXY=$PURL NO_PROXY=127.0.0.1,localhost no_proxy=127.0.0.1,localhost &&
  export GIT_ASKPASS= GIT_TERMINAL_PROMPT=0 GIT_SSH_COMMAND=true &&
  export GIT_CONFIG_COUNT=3
  GIT_CONFIG_KEY_0=http.proxy GIT_CONFIG_VALUE_0=$PURL
  GIT_CONFIG_KEY_1=https.proxy GIT_CONFIG_VALUE_1=$PURL
  GIT_CONFIG_KEY_2=http.proxyAuthMethod GIT_CONFIG_VALUE_2=basic &&
  git config --global http.proxy "$PURL" && git config --global https.proxy "$PURL" && git config --global http.proxyAuthMethod basic &&
  export PYTHONPATH=$ROOT/SWE-ReX/src:$ROOT/SWE-agent:$ROOT/sandboxdev:$ROOT/SWE-bench:$ROOT/R2E-Gym/src:$ROOT/mini-swe-agent/src
  LITELLM_LOCAL_MODEL_COST_MAP=True MSWEA_COST_TRACKING=ignore_errors SWE_RELINK_EDITABLE=1 SWESMITH_FULL_DEPS=1 &&
  export MODEL_PATH=$ROOT/vendor/sft-ckpt/swe_sft_4b_hf SERVED_MODEL_NAME=swe-sft-4b MODEL_NAME=openai/swe-sft-4b
  API_BASE=http://127.0.0.1:8001/v1 VLLM_ENV_NAME=vllm-ascend-cann8.5-v017 &&
  export EVAL_CONFIG_PATH=$ROOT/config/swesmith_infer.yaml
  MSWEA_AGENT_CONFIG=$ROOT/mini-swe-agent/src/minisweagent/config/benchmarks/swebench_minisweagent_clean.yaml
  INSTANCE_TYPE=swesmith INSTANCE_PATH=$ROOT/dataset/SWE-smith INSTANCE_SPLIT=train INSTANCE_END=59136
  INSTANCE_FILTER="$(cat $ROOT/vendor/eval_heldout_filter.txt)"
  RUNTIME_ROOT=$ROOT/vendor/swesmith-cache/eval-sft-pool
  NUM_WORKERS=4 STEP_LIMIT=60 MSWEA_TEMPERATURE=0.0
  OUT_DIR=$ROOT/vendor/swesmith-cache/eval-sft-pool/eval-output &&
  bash sh/run_minisweagent_gen.sh
